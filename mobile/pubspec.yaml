name: mambonami
description: MAMBONAMI – Fresh produce marketplace
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.0
  intl: ^0.18.1
  image_picker: ^1.0.4
  camera: ^0.10.5
  permission_handler: ^11.0.1  # Already used for location permissions

  # Navigation & State Management
  go_router: ^12.0.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4

  # Networking & Storage
  dio: ^5.3.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Geocoding & Maps (NEW)
  google_maps_flutter: ^2.6.0
  geocoding: ^2.1.1
  geolocator: ^10.1.0       # Already present – keep it

  # Local Caching (NEW)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP Client (fallback – optional, but good to have)
  http: ^1.1.0

  # Firebase & Notifications
  firebase_core: 4.9.0
  firebase_messaging: 16.2.2
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Optional: if you plan to use Hive code generation later, add:
  # hive_generator: ^2.0.0
  # build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
    - assets/translations/