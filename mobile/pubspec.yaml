name: mambonami
description: MAMBONAMI – Fresh produce marketplace
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.3.0
  camera: ^0.10.5
  cupertino_icons: ^1.0.6
  dio: ^5.3.3
  equatable: ^2.0.5
  firebase_core: 4.9.0
  firebase_messaging: 16.2.2
  flutter_bloc: ^8.1.3
  flutter_local_notifications: ^21.0.0
  flutter_secure_storage: ^9.0.0
  geolocator: ^10.1.0
  get_it: ^7.6.4
  go_router: ^12.0.0
  google_fonts: ^6.2.1
  image_picker: ^1.0.4
  intl: ^0.18.1
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
    - assets/translations/