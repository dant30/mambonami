name: mambonami
description: MAMBONAMI – Fresh produce marketplace
version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.6
  google_fonts: ^6.3.0
  cached_network_image: ^3.3.0
  intl: ^0.18.1
  image_picker: ^1.1.0
  camera: ^0.11.0
  permission_handler: ^12.0.0

  # Navigation & State Management
  go_router: ^12.0.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  flutter_slidable: ^3.0.0

  # Networking & Storage
  dio: ^5.3.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Geocoding & Maps (NEW)
  google_maps_flutter: ^2.17.0
  geocoding: ^4.0.0
  geolocator: ^13.0.0

  # Local Caching (NEW)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP Client (fallback – optional, but good to have)
  http: ^1.1.0

  # Firebase & Notifications
  firebase_core: 4.9.0
  firebase_messaging: 16.2.2
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Optional: if you plan to use Hive code generation later, add:
  # hive_generator: ^2.0.0
  # build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
    - assets/translations/