upstream fastapi_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.mambonami.com;

    # Security
    location ~ /\.(git|env|htaccess|htpasswd) {
        deny all;
        return 403;
    }

    if ($request_uri ~* "\.\./") {
        return 403;
    }

    # Static
    location /static/ {
        alias /home/dante/apps/mambonami/backend/django_admin/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Media
    location /media/ {
        alias /home/dante/apps/mambonami/backend/django_admin/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # API
    location / {
        proxy_pass http://fastapi_backend;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_buffering off;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health
    location /health {
        proxy_pass http://fastapi_backend/health;
        proxy_set_header Host $host;
    }

    # M-Pesa callback
    location /mpesa/callback/ {
        proxy_pass http://fastapi_backend/mpesa/callback/;
        proxy_set_header Host $host;
    }

    error_page 404 /404.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}