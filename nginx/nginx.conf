events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # ── Upstreams (systemd) ──────────────────────────────────────────
    upstream fastapi_backend {
        server 127.0.0.1:8001;   # FastAPI port – adjust if different
        keepalive 32;
    }

    upstream django_backend {
        server 127.0.0.1:8000;   # Django Gunicorn port
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.mambonami.com;   # Replace with your domain or IP

        # ── Security rules ────────────────────────────────────────────
        # Block access to .git, .env, .htaccess, etc.
        location ~ /\.(git|env|htaccess|htpasswd) {
            deny all;
            return 403;
        }

        # Block directory traversal attempts (../)
        if ($request_uri ~* "\.\./") {
            return 403;
        }

        # ── Static & Media files (direct Nginx serving) ────────────
        location /static/ {
            alias /home/dante/apps/mambonami/backend/django_admin/static/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location /media/ {
            alias /home/dante/apps/mambonami/backend/django_admin/media/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # ── API traffic → FastAPI gateway ────────────────────────────
        location / {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;

            # Long timeouts for M‑Pesa callbacks
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ── Health check ──────────────────────────────────────────────
        location /health {
            proxy_pass http://fastapi_backend/health;
            proxy_set_header Host $host;
        }

        # ── M‑Pesa callback (no extra auth) ─────────────────────────
        location /mpesa/callback/ {
            proxy_pass http://fastapi_backend/mpesa/callback/;
            proxy_set_header Host $host;
        }

        # Error pages
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}